<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore upcoming events and networking chances with the Lagos Chamber of Commerce.">
    <meta name="author" content="Emmanuel Kelikume">
    <meta property="og:title" content="Contact - Lagos Chamber of Commerce">
    <meta property="og:description" content="Contact the Lagos Chamber of Commerce for business support and networking information.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/logo.jpg">
    <meta property="og:url" content="contact.html">
    <title>Contact Us - Lagos Chamber of Commerce</title>
    <link rel="stylesheet" href="styles/base.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Contact Us</h1>
            <button class="menu-toggle" aria-label="Open navigation menu" aria-expanded="false" type="button">☰</button>
        </div>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="directory.html">Directory</a></li>
                <li><a href="discover.html">Discover</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form id="contact-form">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" required>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <div>
                <label for="message">Message:</label>
                <textarea id="message" required></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; <span id="current-year"></span> Lagos Chamber of Commerce</p>
        <p>Last modified: <span id="last-modified"></span></p>
        <p>Developed by Emmanuel Kelikume, WDD231</p>
    </footer>
    <script src="scripts/contact.js" defer></script>
    <script src="scripts/site.js" defer></script>
</body>
</html>
