<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirmation page for Nutritious Bites Collection contact submissions.">
    <meta name="author" content="Emmanuel Kelikume">
    <title>Message Received - Nutritious Bites Collection</title>
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="icon" href="images/favicon.ico">
</head>
<body>
    <header><nav aria-label="Main navigation"><a href="index.html" class="logo">Nutritious Bites Collection</a></nav></header>
    <main class="action-page">
        <h1>Message Received</h1>
        <p>Thank you for contacting Nutritious Bites Collection.</p>
        <dl id="submitted-data"></dl>
        <a class="button-link" href="index.html">Return Home</a>
    </main>
    <footer>
        <p>&copy; <span id="current-year"></span> Nutritious Bites Collection</p>
        <p>Last modified: <span id="last-modified"></span></p>
        <p><a href="attributions.html">Attributions</a></p>
    </footer>
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
        document.getElementById('last-modified').textContent = document.lastModified;
    </script>
    <script type="module">
        import { setPageMeta } from './scripts/module.js';
        setPageMeta();
        const labels = { name: 'Name', email: 'Email', message: 'Message' };
        const params = new URLSearchParams(window.location.search);
        document.getElementById('submitted-data').innerHTML = Object.entries(labels).map(([key, label]) => `<dt>${label}</dt><dd>${params.get(key) || 'Not provided'}</dd>`).join('');
    </script>
</body>
</html>
